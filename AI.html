<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART SNACKING HABITS</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --text-color: #f0f6fc;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-orange: #d29922;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(90deg, #161b22, #21262d);
            width: 100%;
            border-bottom: 2px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-container {
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* QR Scanner Container */
        #reader {
            width: 100%;
            max-width: 400px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #30363d;
            display: none;
            margin-bottom: 15px;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 10px;
        }

        /* அனிமேஷன் எமோஜி பகுதி */
        .emoji-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }

        .emoji-face {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #21262d;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 4px solid #58a6ff;
            transition: all 0.5s ease;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
        }

        .emoji-face.smile {
            border-color: var(--accent-green);
            background: rgba(35, 134, 54, 0.2);
            animation: bounce 1.5s infinite alternate;
        }

        .emoji-face.danger {
            border-color: var(--accent-red);
            background: rgba(218, 54, 51, 0.2);
            animation: pulse 0.8s infinite;
        }

        .eyes {
            display: flex;
            gap: 20px;
            position: absolute;
            top: 25px;
        }

        .eye {
            width: 12px;
            height: 16px;
            background: #f0f6fc;
            border-radius: 50%;
            animation: blink 3s infinite;
        }

        .mouth {
            width: 35px;
            height: 18px;
            border-bottom: 4px solid #f0f6fc;
            border-radius: 0 0 20px 20px;
            position: absolute;
            bottom: 20px;
            transition: 0.3s;
        }

        .emoji-face.danger .mouth {
            border-bottom: none;
            border-top: 4px solid #f0f6fc;
            border-radius: 20px 20px 0 0;
            bottom: 22px;
        }

        /* ஃப்ளோட்டிங் டைப்பிங் பாக்ஸ் */
        .floating-box {
            width: 100%;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            min-height: 80px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-sizing: border-box;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>

    <!-- அதிவேக QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <header>
        <h1>Instead of SMART SNACKING HABITS</h1>
        <p style="margin:5px 0 0; font-size:0.85rem; color:#8b949e;">     AI Assisted Students Health Monitoring System (SHMS)</p>
    </header>

    <div class="container">
        <div class="btn-container">
            <button id="start-cam-btn" onclick="startScanner()">📷 Check The Package</button>
        </div>

        <!-- QR கோடு ஸ்கேனர் பாக்ஸ் -->
        <div id="reader"></div>

        <!-- அனிமேஷன் எமோஜி முகப்பு -->
        <div class="emoji-container">
            <div class="emoji-face" id="emoji-face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth" id="mouth"></div>
            </div>
        </div>

        <!-- ரிசல்ட் காட்டும் ஃப்ளோட்டிங் பாக்ஸ் -->
        <div class="floating-box" id="result-box">
            வணக்கம்! 'Check The Package' பட்டனை அழுத்தி பேக்கேஜ் கியூஆர் கோடை (QR Code) கேமரா முன் காட்டவும்.
        </div>
    </div>

    <script>
        const resultBox = document.getElementById('result-box');
        const emojiFace = document.getElementById('emoji-face');
        const readerDiv = document.getElementById('reader');
        let html5QrcodeScanner = null;

        // PDF ஆவணத் தகவல்கள்[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)
        const messages = {
            healthy: {
                text: "ஆரோக்கியமான தின்பண்டத் தேர்வு! முறையாகத் தயாரிக்கப்பட்டு, பாதுகாப்பாகச் சேமிக்கப்பட்டிருந்தால், இந்தத் தின்பண்டம் சத்தான தேர்வாக இருக்கலாம். சாப்பிடுவதற்கு முன் பொருட்களின் விவரங்களையும் காலாவதி தேதியையும் சரிபார்க்கவும். வீட்டில் தயாரித்த சிறுதானியத் தின்பண்டங்களையும், சுகாதாரமாகத் தயாரிக்கப்பட்ட கடைத் தின்பண்டங்களையும் தேர்ந்தெடுங்கள்!",
                type: "smile"
            },
            unhealthy: {
                text: "உடல்நல எச்சரிக்கை! இந்த நொறுக்குத்தீனியில் அதிக உப்பு, சர்க்கரை அல்லது ஆரோக்கியமற்ற கொழுப்பு இருக்கலாம். இதனை அடிக்கடி சாப்பிடுவதைத் தவிர்க்கவும். இதற்குப் பதிலாகப் புதிய பழங்கள், கொட்டைகள் அல்லது வீட்டில் தயாரித்த சிறுதானியத் தின்பண்டங்களைத் தேர்ந்தெடுங்கள்!",
                type: "danger"
            }
        };

        function startScanner() {
            readerDiv.style.display = 'block';
            resultBox.innerHTML = "கியூஆர் கோடை (QR Code) கேமரா முன் காட்டவும்...";

            if(!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }

            const config = { fps: 15, qrbox: { width: 250, height: 250 } };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                onScanFailure
            ).catch(err => {
                alert("கேமரா தொடங்குவதில் பிழை: " + err);
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            // வெற்றிகரமாக ஸ்கேன் செய்யப்பட்டவுடன் கேமராவை நிறுத்துதல்
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    readerDiv.style.display = 'none';
                }).catch(err => console.error(err));
            }

            let scanData = decodedText.toLowerCase();
            let category = 'unhealthy'; // Default

            // கியூஆர் கோடில் 'good' அல்லது 'healthy' இருந்தால் ஹெல்தி, மற்றவை 'unhealthy'
            if (scanData.includes('good') || scanData.includes('healthy')) {
                category = 'healthy';
            } else {
                category = 'unhealthy';
            }

            showResult(category);
        }

        function onScanFailure(error) {
            // ஸ்கேன் நடக்கும்போது ஒவ்வொரு பிரேமிலும் வரும் சாதாரண தகவல்களைப் புறக்கணிக்கலாம்
        }

        function showResult(category) {
            const data = messages[category];
            
            // எமோஜி மாற்றம்
            emojiFace.className = `emoji-face ${data.type}`;

            // டைப்பிங் & பேசுவது
            typeWriter(data.text);
            speakText(data.text);
        }

        function typeWriter(text) {
            resultBox.innerHTML = "";
            let i = 0;
            function typing() {
                if (i < text.length) {
                    resultBox.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, 20);
                }
            }
            typing();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ta-IN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
